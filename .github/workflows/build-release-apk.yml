name: Build Release APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
      KEY_ALIAS: upload

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore for release signing
        if: env.KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          echo "${KEYSTORE_BASE64}" | base64 --decode > "$KEYSTORE_PATH"
          ls -l "$KEYSTORE_PATH"

      - name: Detect keystore alias
        if: env.KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          ALIAS=$(keytool -list -keystore "$KEYSTORE_PATH" -storepass "${STORE_PASSWORD}" -keypass "${KEY_PASSWORD}" 2>/dev/null | awk '/Alias name:/{print $3; exit}')
          if [ -n "$ALIAS" ]; then
            echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          else
            echo "KEY_ALIAS=upload" >> "$GITHUB_ENV"
          fi

      - name: Generate fallback keystore for CI
        if: env.KEYSTORE_BASE64 == ''
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "${STORE_PASSWORD:-android}" \
            -keypass "${KEY_PASSWORD:-android}" \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Release APK
        shell: bash
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
