name: Build Release APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
      KEY_ALIAS: upload
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK manually
        shell: bash
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT"
          cd /tmp

          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q -o cmdline-tools.zip -d "$ANDROID_SDK_ROOT"
          rm -f cmdline-tools.zip

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/bin" ]; then
            echo "cmdline-tools already in place"
          else
            mv "$ANDROID_SDK_ROOT/cmdline-tools*" "$ANDROID_SDK_ROOT/cmdline-tools/tmp" 2>/dev/null || true
            if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/tmp" ]; then
              rm -rf "$ANDROID_SDK_ROOT/cmdline-tools"
              mv "$ANDROID_SDK_ROOT/cmdline-tools/tmp" "$ANDROID_SDK_ROOT/cmdline-tools"
            fi
          fi

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$GITHUB_WORKSPACE/local.properties"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare release keystore
        shell: bash
        run: |
          set -e

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 --decode > "$KEYSTORE_PATH"

            if keytool -list -keystore "$KEYSTORE_PATH" -storepass "${STORE_PASSWORD:-android}" -keypass "${KEY_PASSWORD:-android}" >/tmp/keystore_check.txt 2>/dev/null; then
              echo "Using provided keystore"
            else
              echo "Provided keystore is invalid or password mismatch. Generating a valid fallback keystore..."
              rm -f "$KEYSTORE_PATH"
            fi
          fi

          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "${STORE_PASSWORD:-android}" \
              -keypass "${KEY_PASSWORD:-android}" \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK
        shell: bash
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
